<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema em Manutenção</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #1a1a2e;
            display: flex; align-items: center; justify-content: center;
            min-height: 100vh; color: #fff;
        }
        .container {
            text-align: center; padding: 40px;
            background: #16213e; border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            max-width: 480px; width: 90%;
        }
        .icon { font-size: 64px; margin-bottom: 20px; }
        h1 { font-size: 26px; margin-bottom: 12px; color: #e2b96f; }
        p { font-size: 15px; color: #a0aec0; line-height: 1.6; margin-bottom: 8px; }
        .eta { margin-top: 24px; padding: 12px 20px; background: #0f3460;
               border-radius: 8px; font-size: 14px; color: #90cdf4; }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">🔧</div>
        <h1>Sistema em Manutenção</h1>
        <p>Estamos realizando uma atualização de servidor.</p>
        <p>O sistema estará disponível em breve.</p>
        <div class="eta">⏱ Previsão de retorno: <strong>alguns minutos</strong></div>
    </div>
</body>
</html>
